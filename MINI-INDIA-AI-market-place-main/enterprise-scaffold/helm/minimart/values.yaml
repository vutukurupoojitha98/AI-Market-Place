replicaCount:
  api: 3
  web: 3

image:
  api:
    repository: ghcr.io/minimart/api
    tag: latest
    pullPolicy: IfNotPresent
  web:
    repository: ghcr.io/minimart/web
    tag: latest

autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 20
  targetCPUUtilizationPercentage: 65

resources:
  api:
    requests: {cpu: 200m, memory: 512Mi}
    limits: {cpu: "1", memory: 1Gi}

ingress:
  enabled: true
  className: nginx
  hosts:
    - {host: minimart.ie, backend: web}
    - {host: api.minimart.ie, backend: api}
  tls:
    - {hosts: [minimart.ie, api.minimart.ie], secretName: minimart-tls}

postgres:
  enabled: true
  storage: 20Gi

redis:
  enabled: true

opensearch:
  enabled: true
  storage: 20Gi

monitoring:
  prometheus: true
  grafana: true

secrets:
  # Prod: use External Secrets Operator or SealedSecrets
  jwtSecret: ""
  stripeApiKey: ""
  openaiApiKey: ""
  dbPassword: ""
