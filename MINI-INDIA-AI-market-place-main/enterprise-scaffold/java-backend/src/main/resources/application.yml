spring:
  application: {name: minimart-api}
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://postgres:5432/minimart}
    username: ${SPRING_DATASOURCE_USERNAME:minimart}
    password: ${SPRING_DATASOURCE_PASSWORD:minimart}
  jpa:
    hibernate: {ddl-auto: validate}
    properties.hibernate.dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway: {enabled: true, locations: classpath:db/migration}
  data.redis:
    host: ${SPRING_REDIS_HOST:redis}
    port: 6379

server:
  port: 8080
  forward-headers-strategy: framework

management:
  endpoints.web.exposure.include: health,info,prometheus,metrics
  endpoint.health.show-details: when-authorized

app:
  jwt.secret: ${JWT_SECRET:change-me}
  jwt.expiry-days: 7
  cors.origins: ${CORS_ORIGINS:*}
  stripe.api-key: ${STRIPE_API_KEY:}
  openai.api-key: ${OPENAI_API_KEY:}
  opensearch.url: ${OPENSEARCH_URL:http://opensearch:9200}

logging:
  pattern.console: '%d{yyyy-MM-dd HH:mm:ss} %-5level [%thread] %logger{36} - %msg%n'
